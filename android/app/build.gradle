plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' version '1.9.24' }

def keystoreProps = new Properties()
def ksFile = rootProject.file("app/keystore.properties")
if (ksFile.exists()) ksFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'io.local.anibrowser'
    compileSdk 34
    ndkVersion '27.1.12297006'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    defaultConfig {
        applicationId 'io.local.anibrowser'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.17'   // keep in sync with the root package.json
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-fexceptions -frtti -std=c++17' }
        }
    }

    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }

    packaging {
        jniLibs { pickFirsts += ['**/libnode.so'] }   // jniLibs copy + CMake IMPORTED target both match
    }
}

dependencies { }   // zero AndroidX/app dependencies — plain android.app.Activity